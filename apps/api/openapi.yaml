openapi: 3.0.3
info:
  title: FeedbackHub API
  version: "1.0.0"
  description: |
    REST API for FeedbackHub, a self-hostable feedback & survey widget platform.
    Administrative endpoints require a Bearer access token. Widget-facing endpoints
    (under /api/v1/public and POST /api/v1/responses) are authenticated with a
    project public key instead of a user session.
servers:
  - url: http://localhost:4000/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    projectKey:
      type: apiKey
      in: header
      name: X-Project-Key
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
paths:
  /auth/register:
    post:
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        "201": { description: Account created }
  /auth/login:
    post:
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { description: Access token issued, refresh token set as HTTP-only cookie }
  /auth/refresh:
    post:
      summary: Rotate the refresh token and obtain a new access token
      responses:
        "200": { description: New access token issued }
  /auth/logout:
    post:
      summary: Revoke the current refresh token session
      responses:
        "200": { description: Logged out }
  /auth/me:
    get:
      summary: Get the current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Current user }
  /organisations:
    get:
      summary: List organisations the current user belongs to
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of organisations }
    post:
      summary: Create an organisation (creator becomes OWNER)
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Organisation created }
  /projects:
    get:
      summary: List projects, optionally filtered by organisationId
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of projects }
    post:
      summary: Create a project within an organisation
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Project created }
  /projects/{id}:
    get:
      summary: Get a project
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Project }
    patch:
      summary: Update a project
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated project }
    delete:
      summary: Soft-delete a project
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /widgets:
    get:
      summary: List widgets for a project
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: List of widgets }
    post:
      summary: Create a widget
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Widget created }
  /widgets/{id}:
    get:
      summary: Get a widget
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Widget }
    patch:
      summary: Update a widget
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated widget }
    delete:
      summary: Soft-delete a widget
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
  /widgets/{id}/publish:
    post:
      summary: Publish a widget (fires widget.published webhook)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Published widget }
  /widgets/{id}/unpublish:
    post:
      summary: Unpublish a widget
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Draft widget }
  /surveys:
    get:
      summary: List surveys for a project
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: List of surveys }
    post:
      summary: Create a survey with questions
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Survey created }
  /surveys/{id}:
    get:
      summary: Get a survey with its questions and options
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Survey }
    patch:
      summary: Update a survey (optionally replacing its question set)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated survey }
  /surveys/{id}/publish:
    post:
      summary: Publish a survey
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Published survey }
  /responses:
    get:
      summary: List responses for a project (paginated, filterable)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: pageSize, in: query, schema: { type: integer } }
      responses:
        "200": { description: Paginated responses }
    post:
      summary: Submit a response (public; authenticated via project public key)
      security: [{ projectKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectKey, widgetId]
              properties:
                projectKey: { type: string }
                widgetId: { type: string }
                rating: { type: integer }
                npsScore: { type: integer }
                feedbackText: { type: string }
      responses:
        "201": { description: Response stored }
  /responses/{id}:
    get:
      summary: Get a response with its answers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Response detail }
  /responses/export/{format}:
    get:
      summary: Export responses as csv or json
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: format, in: path, required: true, schema: { type: string, enum: [csv, json] } }
        - { name: projectId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Export file }
  /analytics:
    get:
      summary: Aggregate analytics (NPS, ratings, thumbs, trends) for a project
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200": { description: Analytics summary }
  /api-keys:
    get:
      summary: List API keys for a project
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: List of API keys (secret values redacted) }
    post:
      summary: Create an API key (public or secret). Secret is returned once.
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: API key created }
  /api-keys/{id}/rotate:
    post:
      summary: Revoke and reissue an API key
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: New API key }
  /webhooks:
    get:
      summary: List webhooks for a project
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: List of webhooks }
    post:
      summary: Create a webhook subscription
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Webhook created (secret returned once) }
  /public/config:
    get:
      summary: SDK bootstrap - published widgets and survey definitions for a project
      security: [{ projectKey: [] }]
      responses:
        "200": { description: Widget/survey configuration }
  /public/events:
    post:
      summary: Track a lightweight product event (used for event-based targeting)
      security: [{ projectKey: [] }]
      responses:
        "201": { description: Event recorded }
